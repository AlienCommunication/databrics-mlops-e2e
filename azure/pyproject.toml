[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/task.py" = ["F821", "E402"]
"src/explore.py" = ["F821"]
"tests/*.py" = ["E402"]
"scripts/predict.py" = ["E402"]
