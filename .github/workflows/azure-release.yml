name: Azure MLOps - release
on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after staging succeeds
        type: boolean
        default: false
      enable_schedules:
        description: Enable production daily and weekly schedules
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-used-car-release
  cancel-in-progress: false
env:
  DATABRICKS_HOST: https://adb-7405610390336981.1.azuredatabricks.net
  DATABRICKS_AUTH_TYPE: github-oidc
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_release: ${{ github.sha }}
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7
        with:
          version: '1.19.0'
      - run: pip install -r requirements.txt
      - run: pytest tests -q
      - run: databricks bundle validate -t staging
      - run: databricks bundle deploy -t staging
      - run: databricks bundle run training -t staging
      - run: databricks bundle run daily_pipeline -t staging
      - run: python scripts/predict.py --endpoint used-car-staging --profile ''
  production:
    if: ${{ inputs.deploy_production }}
    needs: staging
    runs-on: ubuntu-latest
    environment: azure-prod
    env:
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_release: ${{ github.sha }}
      BUNDLE_VAR_pause_status: PAUSED
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7
        with:
          version: '1.19.0'
      - run: pip install -r requirements.txt
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
      - run: databricks bundle run training -t prod
      - run: databricks bundle run daily_pipeline -t prod
      - run: python scripts/predict.py --endpoint used-car-prod --profile ''
      - name: Enable schedules only after production verification
        if: ${{ inputs.enable_schedules }}
        run: databricks bundle deploy -t prod --var pause_status=UNPAUSED
