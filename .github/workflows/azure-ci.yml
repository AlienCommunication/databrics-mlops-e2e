name: Azure MLOps - tests
on:
  push:
    paths: ['azure/**', '.github/workflows/azure-*.yml']
  pull_request:
    paths: ['azure/**', '.github/workflows/azure-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: azure/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests -q
      - name: Check generated workflow definitions
        run: |
          python scripts/generate_jobs.py
          git diff --exit-code resources/jobs.yml
